name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Unit tests and type checking
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run TypeScript checks
        run: npm run typecheck

  integration:
    name: Supabase integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.116.0

      - name: Create the local environment file
        run: cp supabase/.env.example supabase/.env.local

      - name: Start Supabase
        run: supabase start

      - name: Test Daisy booking synchronization
        run: npm run test:integration

      - name: Test Artisia webhooks
        run: npm run test:webhook